<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk load + optimizer test</title>
<style>
 body{font:15px system-ui,sans-serif;margin:12px;background:#111;color:#eee}
 button{font:inherit;padding:10px 12px;margin:4px 4px 4px 0;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
 input{font:inherit;width:5em;padding:6px;background:#222;color:#eee;border:1px solid #555;border-radius:6px}
 pre{white-space:pre-wrap;background:#000;padding:10px;border-radius:8px;min-height:8em}
 h1{font-size:18px;margin:0 0 8px}
</style></head><body>
<h1>Bulk load + optimizer test</h1>
<div>Stocks: <input id="n" type="number" value="1000" min="10" max="3000"></div>
<div>
 <button id="b1">1. Load stocks</button>
 <button id="b2">2. Scan last 300 bars</button>
 <button id="b3">3. Optimizer speed</button>
 <button id="b4">Clear browser store</button>
</div>
<pre id="out">Tap a button. Run 1 twice: the second run shows the speed from browser storage.</pre>
<script type="module">
import { RangeEngine } from './js/range-engine.js';
import { ComputePool } from './js/compute-pool.js';
import { DATABASES, ACTIVE_DB, APP_BUILD } from './js/config.js';

const q = new URLSearchParams(location.search);
const cfg = q.get('base') ? { id: 'test', name: 'test', baseUrl: q.get('base'), firstYear: 2000, currency: 'INR' } : DATABASES[ACTIVE_DB];
const out = document.getElementById('out');
const log = (t) => { out.textContent += '\n' + t; };
let progLine = null;   // one line that is rewritten, instead of hundreds of lines
const prog = (t) => { if (progLine === null) progLine = out.textContent.length; out.textContent = out.textContent.slice(0, progLine) + '\n' + t; };
const progEnd = () => { progLine = null; };
const mb = (b) => (b / 1048576).toFixed(1) + ' MB';
let engine = new RangeEngine(cfg), pool = null, busy = false;

async function pickSymbols() {
  await engine.init();
  if (engine.mode !== 'pack') throw new Error('The pack layout is not on R2 (mode: ' + engine.mode + ')');
  const n = Math.max(10, Math.min(3000, Number(document.getElementById('n').value) || 1000));
  // an even spread over all active stocks (alphabetical list, every k-th), so the test is typical rather than the longest histories
  const active = [...engine.recentIdx.keys()].filter((s) => !s.startsWith('^') && engine.packIdx.has(s)).sort();
  const step = Math.max(1, active.length / n), pick = [];
  for (let i = 0; i < n && Math.floor(i * step) < active.length; i++) pick.push(active[Math.floor(i * step)]);
  return pick;
}
async function guarded(fn) {
  if (busy) return; busy = true;
  try { await fn(); } catch (e) { log('ERROR: ' + (e && e.message || e)); } finally { busy = false; }
}
const conn = navigator.connection ? navigator.connection.effectiveType : '?';
out.textContent = `build ${APP_BUILD} | ${navigator.hardwareConcurrency || '?'} cores | network ${conn} | Keep this screen on and this tab in front while a test runs.\nRun 1 twice: the second run shows the speed from browser storage.`;

document.getElementById('b1').onclick = () => guarded(async () => {
  const syms = await pickSymbols();
  log(`\n[1] loading ${syms.length} stocks ...`);
  const t0 = performance.now(); let bars = 0, last = 0;
  for await (const s of engine.iterMany(syms, { onProgress: (p) => { if (p.phase === 'download' && performance.now() - last > 1000) { last = performance.now(); prog(`   downloading: ${p.requests} requests, ${mb(p.bytes)}, ${((performance.now() - t0) / 1000).toFixed(0)} s`); } } })) bars += s.n;
  progEnd();
  const L = engine.lastBulk;
  log(`[1] done: ${L.stocks} stocks, ${bars} bars in ${((performance.now() - t0) / 1000).toFixed(1)} s\n    download part ${L.downloadSeconds.toFixed(1)} s, decode part ${(L.seconds - L.downloadSeconds).toFixed(1)} s\n    ${L.requests} requests, ${mb(L.bytes)} downloaded, ${L.fromBrowserCache} blocks from browser storage, decode: ${L.decode}${L.decodeNote ? ' (workers did not start: ' + L.decodeNote + ')' : ''}`);
});
document.getElementById('b2').onclick = () => guarded(async () => {
  await engine.init(); log('\n[2] scanning the last 300 bars of every stock ...');
  let n = 0, bars = 0; for await (const s of engine.iterRecent({ bars: 300 })) { n++; bars += s.n; }
  const L = engine.lastScan; log(`[2] done: ${n} stocks, ${bars} bars in ${L.seconds.toFixed(1)} s (download part ${L.downloadSeconds.toFixed(1)} s), ${mb(L.bytes)} downloaded${L.fromBrowserCache ? ' (recent pack came from browser storage)' : ''}, decode: ${L.decode}${L.decodeNote ? ' (workers did not start: ' + L.decodeNote + ')' : ''}`);
});
document.getElementById('b3').onclick = () => guarded(async () => {
  const syms = await pickSymbols();
  if (pool) pool.terminate();
  pool = new ComputePool();
  log(`\n[3] giving ${syms.length} stocks to the workers ...`);
  let last = 0;
  const info = await pool.load(engine, syms, { onProgress: (p) => { if (p.phase === 'download' && performance.now() - last > 1000) { last = performance.now(); prog(`   downloading: ${p.requests} requests, ${mb(p.bytes)}`); } } });
  progEnd();
  log(`    ${info.stocks} stocks, ${info.bars} bars kept in memory by ${info.workers} workers (${info.mode}) in ${info.seconds.toFixed(1)} s`);
  if (pool.pool.fallbackReason) log('    note: workers did not start (' + pool.pool.fallbackReason + '), so this ran inside the page');
  log('    running 600 parameter combinations ...');
  const r = await pool.benchmark({ combos: 600 });
  log(`[3] ${Math.round(r.combosPerSec)} combinations per second over ${r.stocks} stocks (${(r.stockBarsPerSec / 1e6).toFixed(0)} million stock-bars per second)\n    so 100,000 combinations would take about ${Math.round(100000 / r.combosPerSec / 60 * 10) / 10} minutes with this simple test formula`);
});
document.getElementById('b4').onclick = () => guarded(async () => {
  await new Promise((res) => { const r = indexedDB.deleteDatabase('amibroker_bars_' + cfg.id); r.onsuccess = r.onerror = r.onblocked = () => res(); });
  engine = new RangeEngine(cfg); log('\nBrowser store cleared. The next run 1 downloads everything again.');
});
window.__ready = true;
</script></body></html>

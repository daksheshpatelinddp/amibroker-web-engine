<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AmiBroker Web Workstation</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #090d16;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col h-screen w-screen overflow-hidden">

  <!-- Top Navbar -->
  <header class="h-12 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-3 shrink-0 z-10">
    <div class="flex items-center space-x-2">
      <span class="font-bold text-red-500 text-base">AmiBroker</span>
      <input id="symbol-search" type="text" value="RELIANCE" placeholder="Symbol..." class="bg-slate-900 text-slate-200 text-xs px-2 py-1 rounded border border-slate-700 w-24 focus:outline-none focus:border-blue-500 uppercase">
      
      <!-- Analysis Button -->
      <button id="btn-toggle-analysis" type="button" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-xs px-2.5 py-1 rounded text-blue-400 font-medium flex items-center gap-1 border border-slate-600">
        ⚡ <span>Analysis</span>
      </button>
    </div>

    <!-- Data Status Badge -->
    <div id="data-status-badge" class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-2 py-1 rounded text-xs font-mono">
      <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
      <span id="status-text" class="text-amber-300 font-semibold text-[11px]">Initializing Engine...</span>
    </div>
  </header>

  <!-- Fullscreen Chart Container -->
  <main class="flex-1 w-full relative overflow-hidden bg-slate-950">
    <div id="chart-container" class="w-full h-full"></div>
  </main>

  <!-- Analysis Drawer Overlay -->
  <div id="afl-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end backdrop-blur-sm">
    <div class="bg-slate-800 border-t border-slate-700 rounded-t-xl flex flex-col h-[65vh] w-full max-w-3xl mx-auto shadow-2xl">
      
      <div class="h-10 bg-slate-750 border-b border-slate-700 flex items-center justify-between px-4 rounded-t-xl">
        <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
          <span>⚡</span> Analysis & AFL Formula Editor
        </span>
        <div class="flex items-center space-x-2">
          <button id="btn-apply-afl" type="button" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-xs px-3 py-1 rounded text-white font-medium">Apply Formula</button>
          <button id="btn-reset-afl" type="button" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1 rounded text-slate-300">Reset</button>
          <button id="btn-close-analysis" type="button" class="text-slate-400 hover:text-slate-100 text-lg px-1 font-bold ml-1">&times;</button>
        </div>
      </div>

      <div class="flex-1 p-2 bg-slate-900">
        <textarea id="afl-editor-container" class="w-full h-full bg-transparent font-mono text-xs text-slate-200 outline-none resize-none border-none focus:ring-0" placeholder="Enter AFL formula here...">// Default AmiBroker Formula
Plot( Close, "Price", "#26a69a", "candle", true );
Plot( MA(Close, 20), "SMA 20", "#3b82f6", "line" );
Plot( EMA(Close, 50), "EMA 50", "#f97316", "line" );</textarea>
      </div>

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

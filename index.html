<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web Workstation</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Third-Party Libraries -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
</head>
<body class="bg-dark text-light">

    <!-- Top Navigation Header -->
    <header class="app-header">
        <div class="logo-title">
            <span class="logo-icon">📈</span>
            <h1>AmiBroker <span class="badge">Web Workstation</span></h1>
        </div>
        <div class="header-status">
            <span id="data-status" class="status-indicator ready">EOD Ready</span>
        </div>
    </header>

    <!-- Main Workspace Split -->
    <main class="app-container">
        
        <!-- Sidebar: Symbol & Category Manager -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Symbols & Categories</h3>
            </div>
            <div class="category-tree" id="category-tree">
                <!-- Dynamically populated by category-manager.js -->
            </div>
        </aside>

        <!-- Main Content Area: Charts & AFL Editor -->
        <section class="workspace-area">
            
            <!-- Chart Workspace Grid -->
            <div class="chart-container" id="chart-workspace">
                <div id="main-chart" class="chart-cell"></div>
            </div>

            <!-- AFL Formula Editor Drawer -->
            <div class="afl-editor-drawer" id="afl-drawer">
                <div class="afl-toolbar">
                    <span class="editor-title">⚡ AFL Formula Editor</span>
                    <div class="afl-actions">
                        <button id="btn-apply-afl" class="btn btn-primary">Apply Formula</button>
                        <button id="btn-reset-afl" class="btn btn-secondary">Reset Default</button>
                        <button id="btn-toggle-ai" class="btn btn-accent">✨ AI Assistant</button>
                    </div>
                </div>

                <!-- Inline AI Prompt Input (Collapsible) -->
                <div id="ai-prompt-bar" class="ai-prompt-bar hidden">
                    <input type="text" id="ai-prompt-input" placeholder="e.g., Add 50 EMA and 200 SMA with an RSI pane below..." />
                    <button id="btn-generate-ai" class="btn btn-small">Generate</button>
                </div>

                <!-- Code Mirror AFL Code Box -->
                <div class="editor-container">
                    <textarea id="afl-code-input"></textarea>
                </div>
            </div>

        </section>
    </main>

    <!-- Application JavaScript Modules -->
    <script src="js/data-engine.js"></script>
    <script src="js/afl-engine.js"></script>
    <script src="js/chart-engine.js"></script>
    <script src="js/category-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

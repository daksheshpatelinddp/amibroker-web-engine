<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web Workstation</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet Path -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Top Navigation / Header Bar -->
        <header class="top-bar">
            <div class="bar-left">
                <button id="btn-toggle-drawer" class="icon-btn" title="Toggle Categories Drawer">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-title">
                    <i class="fa-solid fa-chart-line brand-icon"></i>
                    <span>AmiBroker <small>Web Workstation</small></span>
                </div>
            </div>

            <!-- Global Quick Search Bar -->
            <div class="quick-search-wrapper">
                <div class="search-input-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="quick-search-input" placeholder="Search symbol or category (e.g. RELIANCE)..." autocomplete="off">
                    <button id="btn-clear-search" class="clear-btn hidden"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="search-results-dropdown" class="search-results-dropdown hidden"></div>
            </div>

            <!-- Top Controls Right -->
            <div class="bar-right">
                <div class="category-dropdown-group">
                    <select id="select-group-filter" class="nav-select"><option value="">Group: All</option></select>
                    <select id="select-sector-filter" class="nav-select"><option value="">Sector: All</option></select>
                    <select id="select-industry-filter" class="nav-select"><option value="">Industry: All</option></select>
                </div>

                <div class="layout-toggle-group">
                    <button class="layout-btn active" data-layout="1x1" title="Single Chart"><i class="fa-solid fa-square"></i></button>
                    <button class="layout-btn" data-layout="2x1" title="Dual Horizontal"><i class="fa-solid fa-table-columns"></i></button>
                    <button class="layout-btn" data-layout="2x2" title="2x2 Grid"><i class="fa-solid fa-table-cells"></i></button>
                </div>
            </div>
        </header>

        <!-- Main Workspace Body -->
        <div class="workspace-body">
            <!-- Sidebar Category Manager Drawer -->
            <aside id="category-drawer" class="category-drawer">
                <div class="drawer-header">
                    <h3><i class="fa-solid fa-folder-tree"></i> Categories</h3>
                    <button id="btn-close-drawer" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="drawer-tabs">
                    <button class="drawer-tab active" data-tab="tab-symbols">Symbols</button>
                    <button class="drawer-tab" data-tab="tab-watchlists">Watchlists</button>
                    <button class="drawer-tab" data-tab="tab-favorites">Favorites</button>
                    <button class="drawer-tab" data-tab="tab-import">Batch Import</button>
                </div>

                <div class="drawer-content">
                    <div id="tab-symbols" class="tab-pane active">
                        <div class="category-tree" id="category-tree-container"></div>
                    </div>

                    <div id="tab-watchlists" class="tab-pane">
                        <div class="pane-action-bar">
                            <input type="text" id="new-watchlist-name" placeholder="New Watchlist Name...">
                            <button id="btn-create-watchlist" class="btn primary-btn"><i class="fa-solid fa-plus"></i> Create</button>
                        </div>
                        <div id="watchlists-list-container" class="lists-wrapper"></div>
                    </div>

                    <div id="tab-favorites" class="tab-pane">
                        <div id="favorites-list-container" class="lists-wrapper"></div>
                    </div>

                    <div id="tab-import" class="tab-pane">
                        <div class="import-box">
                            <label for="file-import-txt" class="file-label">
                                <i class="fa-solid fa-file-arrow-up"></i>
                                <span>Select TXT File</span>
                                <small>Format: Symbol, Group, Sector, Industry</small>
                            </label>
                            <input type="file" id="file-import-txt" accept=".txt,.csv" class="hidden-file-input">
                            <div id="import-preview" class="import-preview hidden"></div>
                            <button id="btn-execute-import" class="btn success-btn hidden"><i class="fa-solid fa-file-import"></i> Execute Import</button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Chart Workstation Workspace -->
            <main class="chart-workspace">
                <div class="workspace-tabs-bar" id="workspace-tabs-bar"></div>

                <div id="chart-grid-container" class="chart-grid grid-1x1">
                    <div class="chart-cell active" id="chart-cell-1">
                        <div class="chart-cell-header">
                            <span class="cell-symbol-title" id="active-symbol-title">Select a Symbol</span>
                            <div class="cell-tools">
                                <span class="data-status-badge" id="data-status-badge"><i class="fa-solid fa-circle-notch fa-spin"></i> Initializing DuckDB</span>
                                <span class="timeframe-pill active">EOD</span>
                            </div>
                        </div>
                        <div class="chart-render-target" id="chart-render-1">
                            <div class="empty-chart-placeholder">
                                <i class="fa-solid fa-chart-candlestick"></i>
                                <p>Select any symbol from the drawer or quick search to fetch Parquet EOD data.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- DuckDB-WASM CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-wasm.js"></script>
    
    <!-- Application Scripts -->
    <script src="./js/category-manager.js"></script>
    <script src="./js/data-engine.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AmiBroker Web Workstation</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- TradingView Lightweight Charts & DuckDB WASM -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-wasm.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen overflow-hidden">

  <!-- Top Navbar -->
  <header class="h-12 bg-gray-800 flex items-center justify-between px-4 border-b border-gray-700">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-red-500 text-lg">AmiBroker</span>
      <span class="bg-gray-700 px-2 py-1 rounded text-xs font-mono">RELIANCE</span>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Status Badge Target -->
      <span id="engine-status-badge" class="status-indicator text-xs font-semibold text-yellow-400">
        ● Initializing Engine...
      </span>
    </div>
  </header>

  <!-- Workspace Viewport for Multi-Pane Charts -->
  <main id="workspace-viewport" class="flex-1 w-full relative overflow-y-auto bg-black p-1">
    <!-- Multi-pane dynamic stack injected here -->
  </main>

  <!-- Application JS Entry point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web Workstation</title>
    
    <!-- Third-Party CSS & Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Third-Party JS -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
</head>
<body class="bg-dark text-light">

    <!-- Top Navigation Header with Symbol Search -->
    <header class="app-header">
        <div class="header-brand">
            <span class="logo-icon">📈</span>
            <span class="app-name">AmiBroker</span>
        </div>

        <div class="symbol-search-box">
            <input type="text" id="symbol-search-input" placeholder="🔍 Search symbol (e.g. RELIANCE, TCS, INFY)..." autocomplete="off" />
            <div id="search-dropdown" class="search-dropdown hidden"></div>
        </div>

        <div class="header-status">
            <div class="active-symbol-badge">
                Symbol: <span id="active-symbol-name">RELIANCE.NS</span>
            </div>
            <span id="data-status" class="status-indicator ready">EOD Ready</span>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="app-container">
        
        <!-- Sidebar: Symbol Category Tree -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Symbols & Categories</h3>
            </div>
            <div class="category-tree" id="category-tree">
                <div class="tree-section">
                    <span class="tree-title">📁 Nifty 50</span>
                    <ul class="symbol-list">
                        <li class="symbol-item active" data-symbol="RELIANCE.NS">RELIANCE.NS</li>
                        <li class="symbol-item" data-symbol="TCS.NS">TCS.NS</li>
                        <li class="symbol-item" data-symbol="INFY.NS">INFY.NS</li>
                        <li class="symbol-item" data-symbol="HDFCBANK.NS">HDFCBANK.NS</li>
                        <li class="symbol-item" data-symbol="ICICIBANK.NS">ICICIBANK.NS</li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Main Chart & Formula Workspace -->
        <section class="workspace-area">
            
            <!-- Dynamic TradingView Chart Canvas -->
            <div class="chart-container" id="chart-workspace">
                <div id="main-chart" class="chart-cell"></div>
            </div>

            <!-- AFL Formula Code Drawer -->
            <div class="afl-editor-drawer" id="afl-drawer">
                <div class="afl-toolbar">
                    <span class="editor-title">⚡ AFL Formula Editor</span>
                    <div class="afl-actions">
                        <button id="btn-apply-afl" class="btn btn-primary">Apply Formula</button>
                        <button id="btn-reset-afl" class="btn btn-secondary">Reset Default</button>
                        <button id="btn-toggle-ai" class="btn btn-accent">✨ AI Assistant</button>
                    </div>
                </div>

                <!-- Collapsible AI Prompt Drawer -->
                <div id="ai-prompt-bar" class="ai-prompt-bar hidden">
                    <input type="text" id="ai-prompt-input" placeholder="e.g., Add 50 EMA and 200 SMA with RSI panel below..." />
                    <button id="btn-generate-ai" class="btn btn-small">Generate</button>
                </div>

                <!-- Code Mirror Textarea -->
                <div class="editor-container">
                    <textarea id="afl-code-input"></textarea>
                </div>
            </div>

        </section>
    </main>

    <!-- Application Engine Scripts -->
    <script src="js/data-engine.js"></script>
    <script src="js/afl-engine.js"></script>
    <script src="js/chart-engine.js"></script>
    <script src="js/category-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AmiBroker Web Workstation</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- TradingView Lightweight Charts CDN -->
  <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="h-full flex flex-col overflow-hidden text-xs antialiased select-none">
  <!-- Top Navigation / Status Header -->
  <header class="h-10 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 shrink-0">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-slate-200 tracking-wide">AmiBroker Web</span>
      <span id="status-badge" class="px-2 py-0.5 text-[10px] font-medium rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        ● Initializing Engine...
      </span>
    </div>
    <div class="flex items-center space-x-2" id="header-controls">
      <!-- Symbol search -->
<div class="relative">
        <input id="symbol-input" type="search" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
               autocapitalize="characters" placeholder="Search symbol..."
               class="select-text w-40 bg-slate-800 border border-slate-700 text-slate-200 rounded px-2 py-1 text-xs outline-none focus:border-sky-500 uppercase" />
        <ul id="symbol-suggest"
            class="hidden absolute right-0 mt-1 w-56 max-h-72 overflow-y-auto bg-slate-800 border border-slate-700 rounded shadow-xl z-50"></ul>
      </div>
    </div>
  </header>

  <!-- Main Workstation Canvas Area -->
  <main class="flex-1 flex flex-col min-h-0 relative">
    <!-- Symbol header: the symbol of the active sheet, last price and change (follows the crosshair) -->
    <div id="symbol-bar" class="bg-slate-900/80 border-b border-slate-800 flex items-center justify-between px-3 py-1 shrink-0 space-x-2">
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline space-x-2">
          <span id="sym-title" class="text-base font-bold text-slate-100 truncate">-</span>
          <span id="sym-price" class="text-sm text-slate-200"></span>
          <span id="sym-change" class="text-xs"></span>
        </div>
        <div id="sym-ohlc" class="text-[10px] text-slate-400 truncate"></div>
      </div>
      <div class="flex items-center space-x-1 shrink-0">
        <button id="btn-add-pane" type="button" class="px-2 py-1 rounded bg-sky-600 text-white text-[11px] font-semibold">＋ Pane</button>
        <button id="btn-fit" type="button" class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 text-[11px]">Fit</button>
        <button id="btn-latest" type="button" class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-200 text-[11px]">Latest</button>
      </div>
    </div>

    <!-- Multi-pane chart. #pane-labels holds the tappable pane titles drawn over it -->
    <div id="chart-workspace" class="flex-1 min-h-0 w-full relative bg-slate-950 flex flex-col">
      <div id="chart-container" class="w-full h-full min-h-0 flex-1"></div>
      <div id="pane-labels" class="absolute inset-0 pointer-events-none z-20"></div>
    </div>

    <!-- Sheet tabs: below the chart -->
    <div id="sheet-bar" class="h-9 bg-slate-900/80 border-t border-slate-800 flex items-center px-2 shrink-0">
      <!-- injected by SheetManager -->
    </div>
  </main>

  <!-- Footer / System Info -->
  <footer class="h-6 bg-slate-900 border-t border-slate-800 flex items-center justify-between px-3 text-[10px] text-slate-400 shrink-0">
    <span id="cache-status" class="truncate min-w-0 flex-1 mr-2">Starting...</span>
    <span id="data-timestamp" class="shrink-0">Updated: --</span>
  </footer>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

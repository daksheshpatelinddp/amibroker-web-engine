<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web Workstation</title>
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CodeMirror CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <!-- DuckDB WASM -->
    <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-wasm.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header>
            <div class="brand">
                <span class="logo">📈</span>
                <span class="title">AmiBroker</span>
            </div>
            <div class="search-box">
                <input type="text" id="symbol-search-input" placeholder="Search symbol (e.g. RELIANCE)..." />
            </div>
            <div class="symbol-info">
                <span id="current-symbol-label">Symbol: RELIANCE (NSE)</span>
                <span class="badge">EOD Ready</span>
            </div>
        </header>

        <!-- Main Body -->
        <div id="main-workspace">
            <!-- Sidebar -->
            <aside id="sidebar">
                <h3>Symbols &amp; Categories</h3>
                <ul class="symbol-list" id="symbol-list">
                    <li data-symbol="RELIANCE" class="active">RELIANCE</li>
                    <li data-symbol="TCS">TCS</li>
                    <li data-symbol="INFY">INFY</li>
                    <li data-symbol="HDFCBANK">HDFCBANK</li>
                    <li data-symbol="ICICIBANK">ICICIBANK</li>
                    <li data-symbol="TATAMOTORS">TATAMOTORS</li>
                    <li data-symbol="SBIN">SBIN</li>
                    <li data-symbol="BHARTIARTL">BHARTIARTL</li>
                </ul>
            </aside>

            <!-- Chart & AFL Panel Column -->
            <main id="content-area">
                <div id="chart-container"></div>

                <!-- AFL Panel -->
                <div id="afl-panel">
                    <div id="afl-toolbar">
                        <span>⚡ AFL Formula Editor</span>
                        <button id="apply-formula-btn" class="action-btn">Apply Formula</button>
                    </div>
                    <div id="editor-wrapper">
                        <textarea id="afl-editor"></textarea>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Application Engines -->
    <script src="js/data-engine.js"></script>
    <script src="js/chart-engine.js"></script>
    <script src="js/afl-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

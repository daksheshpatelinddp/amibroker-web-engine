<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web - Quantitative Charting & Backtester</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Top Area: Inserted Symbol Name as Header / Ticker Info Banner -->
        <header id="symbol-header" class="app-header">
            <!-- Dynamically injected by App controller -->
        </header>

        <!-- Main Workspace: Charts Area -->
        <main class="workspace-main">
            <div id="chart-container" class="chart-viewport"></div>
        </main>

        <!-- Sheets Tab Bar positioned BELOW the chart area -->
        <footer id="sheet-tabs-footer" class="sheet-footer">
            <div id="sheet-tabs-container" class="sheet-tabs-bar">
                <!-- Dynamic sheet tabs inserted here -->
            </div>
        </footer>
    </div>

    <!-- Application Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

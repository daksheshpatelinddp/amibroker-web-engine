<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AmiBroker Web Workstation</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0284c7', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="h-full flex flex-col overflow-hidden text-xs antialiased bg-slate-950 text-slate-100">

  <!-- Mobile-First Header -->
  <header class="h-11 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-2 sm:px-3 shrink-0">
    <div class="flex items-center space-x-2 min-w-0">
      <span class="font-bold text-slate-200 tracking-wide truncate text-xs sm:text-sm">AmiBroker Web</span>
      <span id="status-badge" class="px-2 py-0.5 text-[9px] sm:text-[10px] font-medium rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 shrink-0">
        ● Initializing Engine...
      </span>
    </div>

    <!-- Symbol Search Trigger Button -->
    <button id="symbol-search-btn" class="bg-slate-800 active:bg-sky-600 hover:bg-slate-700 border border-slate-700 text-slate-200 px-2.5 py-1.5 rounded-md flex items-center space-x-1.5 transition text-xs shrink-0">
      <span class="text-sky-400 text-xs">🔍</span>
      <span id="current-symbol-label" class="font-bold text-sky-400 tracking-wider">RELIANCE</span>
      <span class="hidden md:inline text-slate-500 text-[10px] pl-1">(Ctrl+K)</span>
    </button>
  </header>

  <!-- Workstation Area -->
  <main class="flex-1 flex flex-col min-h-0 relative">
    <div id="sheet-bar" class="h-8 bg-slate-900/80 border-b border-slate-800 flex items-center px-2 space-x-1 overflow-x-auto shrink-0"></div>
    <div id="chart-workspace" class="flex-1 min-h-0 w-full relative bg-slate-950 flex flex-col">
      <div id="chart-container" class="w-full h-full min-h-0 flex-1"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="h-6 bg-slate-900 border-t border-slate-800 flex items-center justify-between px-3 text-[10px] text-slate-400 shrink-0">
    <span id="cache-status">R2 Cache: Checking...</span>
    <span id="data-timestamp">Updated: --</span>
  </footer>

  <!-- Responsive Symbol Search Modal (Mobile Bottom-Sheet & Desktop Centered Popup) -->
  <div id="symbol-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-end sm:items-start justify-center sm:pt-16 px-0 sm:px-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 rounded-t-xl sm:rounded-lg shadow-2xl w-full max-w-lg flex flex-col overflow-hidden max-h-[85vh] sm:max-h-[70vh]">
      
      <!-- Modal Header -->
      <div class="p-3 border-b border-slate-800 flex items-center justify-between space-x-2">
        <div class="relative flex-1">
          <input type="text" id="symbol-search-input" placeholder="Search 2000+ symbols (e.g. RELIANCE, INFY)..." 
                 class="bg-slate-950 border border-slate-700 text-slate-100 pl-8 pr-3 py-2 rounded-lg w-full outline-none focus:border-sky-500 text-xs sm:text-sm tracking-wider uppercase placeholder:normal-case placeholder:text-slate-500" autocomplete="off" autocorrect="off" spellcheck="false" />
          <span class="absolute left-2.5 top-2.5 text-slate-500">🔍</span>
        </div>
        <button id="close-modal-btn" class="p-2 text-slate-400 active:text-white sm:hover:text-white text-lg font-bold">✕</button>
      </div>

      <!-- Quick Ticker Chips -->
      <div class="px-3 py-1.5 bg-slate-950/50 border-b border-slate-800 flex items-center space-x-1.5 overflow-x-auto text-[10px] shrink-0">
        <span class="text-slate-500 shrink-0">Popular:</span>
        <button class="quick-chip bg-slate-800 active:bg-sky-600 px-2 py-0.5 rounded text-slate-300">RELIANCE</button>
        <button class="quick-chip bg-slate-800 active:bg-sky-600 px-2 py-0.5 rounded text-slate-300">TCS</button>
        <button class="quick-chip bg-slate-800 active:bg-sky-600 px-2 py-0.5 rounded text-slate-300">INFY</button>
        <button class="quick-chip bg-slate-800 active:bg-sky-600 px-2 py-0.5 rounded text-slate-300">HDFCBANK</button>
        <button class="quick-chip bg-slate-800 active:bg-sky-600 px-2 py-0.5 rounded text-slate-300">TATAMOTORS</button>
      </div>

      <!-- Symbol Search Result List -->
      <div id="symbol-results-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/60 p-1 min-h-[200px]">
        <!-- Dynamically populated rows -->
      </div>

      <!-- Modal Footer -->
      <div class="p-2.5 bg-slate-950 border-t border-slate-800 text-[10px] text-slate-500 flex justify-between items-center shrink-0">
        <span>Tap symbol to select</span>
        <span id="total-symbols-count">0 symbols loaded</span>
      </div>

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmiBroker Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top Control Bar (Header with Symbol Name) -->
  <div id="top-bar" class="top-bar">
    <div class="symbol-header-container">
      <span id="active-symbol-header" class="symbol-header">RELIANCE</span>
      <span id="engine-status" class="status-badge">Engine Ready</span>
    </div>
    <div class="top-controls">
      <button id="btn-fit" class="btn">Fit</button>
      <button id="btn-latest" class="btn">Latest</button>
    </div>
  </div>

  <!-- Main Chart Area -->
  <div id="chart-container" class="chart-container"></div>

  <!-- Bottom Sheet Tabs Bar -->
  <div id="bottom-sheet-bar" class="sheet-bar">
    <div id="sheets-list" class="sheets-list"></div>
    <button id="add-sheet-btn" class="add-sheet-btn" title="Add Sheet">+</button>
  </div>

  <!-- Scripts -->
  <script src="js/sheet-manager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

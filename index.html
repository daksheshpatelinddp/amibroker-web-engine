<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Workstation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <button id="btnToggleSidebar" class="btn-header">
                    📋 Categories
                </button>
                <span style="font-weight: 600; margin-left: 4px;">📈 AmiBroker</span>
                
                <!-- Quick Search Box -->
                <div style="position: relative; margin-left: 10px;">
                    <input type="text" id="symbolSearchInput" placeholder="Search Symbol..." class="dropdown-select" style="width: 140px; text-transform: uppercase;">
                    <ul id="searchResults" class="symbol-list hidden" style="position: absolute; top: 100%; left: 0; width: 220px; max-height: 200px; background: var(--bg-panel); border: 1px solid var(--border-color); z-index: 1000;"></ul>
                </div>
            </div>

            <div class="header-right">
                <button class="btn-header tab-btn active" data-tab="tab-chart">Chart Sheet 1</button>
                <button class="btn-header tab-btn" data-tab="tab-exploration">Exploration / Scanner</button>
                <button class="btn-header tab-btn" data-tab="tab-backtest">Portfolio Backtester</button>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

            <!-- Categories Sidebar Drawer -->
            <aside id="sidebarPanel" class="sidebar collapsed">
                <div class="sidebar-header">
                    <span class="sidebar-title">Categories & Watchlists</span>
                    <button id="btnCloseSidebar" class="btn-close">&times;</button>
                </div>
                
                <!-- Top Nav Tabs -->
                <div class="cat-tabs">
                    <button class="cat-tab-btn active" data-cat="groups">Groups</button>
                    <button class="cat-tab-btn" data-cat="sectors">Sectors</button>
                    <button class="cat-tab-btn" data-cat="industries">Industries</button>
                    <button class="cat-tab-btn" data-cat="watchlists">Watchlists</button>
                    <button class="cat-tab-btn" data-cat="favorites">⭐ Favorites</button>
                </div>

                <!-- Sub-Category Selection & Add New Group/Sector/Industry -->
                <div class="category-controls">
                    <div id="subFilterContainer" style="display: flex; gap: 4px; margin-bottom: 6px;">
                        <select id="categorySubFilter" class="dropdown-select" style="flex: 1;">
                            <option value="ALL">All Symbols</option>
                        </select>
                    </div>

                    <!-- Action Bar to Add New Group/Sector/Industry/Watchlist -->
                    <div id="createCategoryBar" style="display: flex; gap: 4px; margin-bottom: 6px;">
                        <input type="text" id="txtNewCategoryName" placeholder="New Folder Name..." class="dropdown-select" style="flex: 1;">
                        <button id="btnCreateCategory" class="btn-header" style="padding: 4px 8px;">+ Add</button>
                    </div>

                    <!-- Manage Symbols Bar (Add Single / TXT Import) -->
                    <div id="manageSymbolsBar" style="display: flex; flex-direction: column; gap: 4px;">
                        <div style="display: flex; gap: 4px;">
                            <input type="text" id="txtAddSymbol" placeholder="Add Symbol (e.g. RELIANCE.NS)" class="dropdown-select" style="flex: 1; text-transform: uppercase;">
                            <button id="btnAddSingleSymbol" class="btn-header" style="padding: 4px 8px;">Add</button>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;">
                            <label class="btn-header" style="cursor: pointer; font-size: 11px;">
                                📁 Import TXT File
                                <input type="file" id="fileImportTxt" accept=".txt" style="display: none;">
                            </label>
                            <button id="btnClearCurrentCategory" class="btn-header" style="color: #ff5252; font-size: 11px;">Clear All</button>
                        </div>
                    </div>
                </div>

                <!-- Symbol Display List -->
                <ul id="symbolList" class="symbol-list"></ul>
            </aside>

            <!-- Main Canvas View Area -->
            <main class="view-container">
                <div id="tab-chart" class="tab-content active" style="height: 100%; display: flex; flex-direction: column;">
                    <div class="chart-toolbar">
                        <span id="lblActiveSymbol" class="symbol-label">HDFCBANK.NS</span>
                        <button id="btnToggleFavorite" class="btn-header">⭐ Favorite</button>
                        <button class="btn-header">Reset View</button>
                    </div>
                    <div id="chartContainer" class="chart-viewport"></div>
                </div>

                <div id="tab-exploration" class="tab-content hidden" style="padding: 16px;">
                    <button id="btnRunExploration" class="btn-header active">Run Exploration</button>
                </div>

                <div id="tab-backtest" class="tab-content hidden" style="padding: 16px;">
                    <button id="btnRunBacktest" class="btn-header active">Execute Backtest</button>
                </div>

                <div class="console-panel">
                    <div class="console-header">AFL Output Log / Console</div>
                    <div class="console-logs" id="consoleLogs">[System] Workstation Initialized</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Script Order -->
    <script src="js/category-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

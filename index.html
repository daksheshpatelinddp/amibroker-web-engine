<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmiBroker Web Workstation</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

  <!-- Top Navbar -->
  <header class="h-12 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 shrink-0">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-red-500 text-lg">AmiBroker</span>
      <div class="relative">
        <input id="symbol-search" type="text" value="RELIANCE" placeholder="Search symbol..." class="bg-slate-900 text-slate-200 text-sm px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-blue-500 uppercase">
      </div>
      <span id="current-symbol-badge" class="bg-slate-700 text-xs px-2 py-1 rounded text-blue-400 font-mono">Symbol: RELIANCE (NSE)</span>
    </div>

    <!-- Data Loading / Cache Status Indicator -->
    <div id="data-status-badge" class="text-xs px-2 py-1 rounded bg-slate-700 text-slate-300 font-mono flex items-center gap-2">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
      <span id="status-text">Initializing Engine...</span>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Chart Container -->
    <div id="chart-container" class="flex-1 bg-slate-950 relative"></div>
  </main>

  <!-- AFL Formula Editor Bar (Bottom) -->
  <footer class="h-48 bg-slate-800 border-t border-slate-700 flex flex-col shrink-0">
    <div class="h-8 bg-slate-750 border-b border-slate-700 flex items-center justify-between px-3">
      <span class="text-xs font-semibold text-slate-400">⚡ AFL Formula Editor</span>
      <div class="flex space-x-2">
        <button id="btn-apply-afl" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1 rounded text-white font-medium">Apply Formula</button>
        <button id="btn-reset-afl" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1 rounded text-slate-300">Reset Default</button>
      </div>
    </div>
    <div id="afl-editor-container" class="flex-1 p-2 bg-slate-900 font-mono text-xs text-slate-200 overflow-auto">
      // Default AmiBroker Formula<br>
      Plot( Close, "Price", "#26a69a", "candle", true );
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmiBroker Web Engine — Mobile & Desktop</title>
  <style>
    :root {
      --bg-main: #121212;
      --bg-panel: #1a1a1a;
      --bg-card: #222222;
      --border-color: #333333;
      --accent: #00e676;
      --accent-hover: #00b359;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1rem; color: var(--accent); font-weight: bold; }

    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar - Symbol & Formula Explorer */
    .sidebar {
      width: 280px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 10px;
    }

    .sidebar-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label { font-size: 0.75rem; color: var(--accent); font-weight: bold; text-transform: uppercase; }
    input, select, textarea, button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: monospace;
      width: 100%;
    }
    textarea { resize: vertical; height: 100px; }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: #444; color: #777; cursor: not-allowed; }

    /* Main Chart & Tab Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
    }
    .tab-btn {
      padding: 8px 16px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-right: 1px solid var(--border-color);
      border-radius: 0;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    .tab-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: auto;
      padding: 8px;
    }
    .tab-content.active { display: flex; }

    /* Multi-Pane Chart Canvas Stack */
    .chart-stack {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 2px;
      background: #000;
      position: relative;
    }
    .chart-pane {
      position: relative;
      background: #181818;
      width: 100%;
      flex: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Console Logs */
    #consoleLog {
      background: #000;
      color: var(--accent);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 6px;
      height: 80px;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      white-space: pre-wrap;
    }

    /* Data Tables */
    .table-wrapper { overflow-x: auto; max-height: 100%; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 0.75rem; }
    th, td { border: 1px solid var(--border-color); padding: 6px 8px; text-align: left; }
    th { background: var(--bg-card); color: var(--accent); position: sticky; top: 0; }
    tr:nth-child(even) { background: #181818; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .metric-card {
      background: var(--bg-card);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .metric-title { font-size: 0.7rem; color: var(--text-muted); }

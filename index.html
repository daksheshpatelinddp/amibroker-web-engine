<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AmiBroker Web Workstation</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="h-full flex flex-col overflow-hidden text-xs antialiased select-none">
  <!-- Top Navigation / Status Header -->
  <header class="h-10 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 shrink-0">
    <div class="flex items-center space-x-2">
      <span class="font-bold text-slate-200 tracking-wide">AmiBroker Web</span>
      <span id="status-badge" class="px-2 py-0.5 text-[10px] font-medium rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
        ● Initializing Engine...
      </span>
    </div>

    <!-- Symbol Search Trigger Button -->
    <div class="flex items-center space-x-2">
      <button id="symbol-search-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-1 rounded flex items-center space-x-2 transition text-xs">
        <span id="current-symbol-label" class="font-bold text-sky-400">RELIANCE</span>
        <span class="text-slate-500 text-[10px]">🔍 Find (Ctrl+K)</span>
      </button>
    </div>
  </header>

  <!-- Main Workstation Canvas Area -->
  <main class="flex-1 flex flex-col min-h-0 relative">
    <div id="sheet-bar" class="h-8 bg-slate-900/80 border-b border-slate-800 flex items-center px-2 space-x-1 overflow-x-auto shrink-0">
      <!-- Sheet Tabs injected by SheetManager -->
    </div>

    <div id="chart-workspace" class="flex-1 min-h-0 w-full relative bg-slate-950 flex flex-col">
      <div id="chart-container" class="w-full h-full min-h-0 flex-1"></div>
    </div>
  </main>

  <!-- Footer / System Info -->
  <footer class="h-6 bg-slate-900 border-t border-slate-800 flex items-center justify-between px-3 text-[10px] text-slate-400 shrink-0">
    <span id="cache-status">R2 Cache: Synchronizing...</span>
    <span id="data-timestamp">Updated: --</span>
  </footer>

  <!-- Searchable Symbol Auto-Complete Modal -->
  <div id="symbol-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-start justify-center pt-16 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-2xl w-full max-w-md flex flex-col overflow-hidden">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between">
        <input type="text" id="symbol-search-input" placeholder="Type symbol ticker (e.g. RELIANCE, INFY, TCS)..." 
               class="bg-slate-950 border border-slate-800 text-slate-100 px-3 py-1.5 rounded w-full outline-none focus:border-sky-500 text-xs tracking-wider" autocomplete="off" />
      </div>
      <div id="symbol-results-list" class="max-h-64 overflow-y-auto divide-y divide-slate-800/50 p-1">
        <!-- Dynically populated symbols -->
      </div>
      <div class="p-2 bg-slate-950 border-t border-slate-800 text-[10px] text-slate-500 flex justify-between">
        <span>Press ESC to close</span>
        <span id="total-symbols-count">0 symbols loaded</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

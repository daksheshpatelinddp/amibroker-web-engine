<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web Workstation</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        
        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <div class="bar-left">
                <button class="icon-btn" id="menuBtn" title="Toggle Categories Drawer">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-title">
                    <i class="fa-solid fa-chart-line brand-icon"></i>
                    <span>AmiBroker</span>
                    <small>Web Workstation</small>
                </div>
                
                <!-- Global Quick Search -->
                <div class="quick-search-wrapper">
                    <div class="search-input-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="globalSearchInput" placeholder="Search symbol or category (e.g. RELIANCE)" autocomplete="off">
                        <button class="clear-btn" id="clearSearchBtn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>

            <div class="bar-right">
                <!-- Group / Sector / Industry Dropdowns -->
                <div class="category-dropdown-group">
                    <select id="groupSelect" class="nav-select">
                        <option value="">Group: All</option>
                    </select>
                    <select id="sectorSelect" class="nav-select">
                        <option value="">Sector: All</option>
                    </select>
                    <select id="industrySelect" class="nav-select">
                        <option value="">Industry: All</option>
                    </select>
                </div>

                <!-- Grid Layout Switcher Buttons -->
                <div class="layout-toggle-group">
                    <button class="layout-btn active" data-layout="1x1" title="1x1 Grid">
                        <i class="fa-solid fa-square"></i>
                    </button>
                    <button class="layout-btn" data-layout="2x1" title="2x1 Grid">
                        <i class="fa-solid fa-table-columns"></i>
                    </button>
                    <button class="layout-btn" data-layout="2x2" title="2x2 Grid">
                        <i class="fa-solid fa-table-cells"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Workspace Body -->
        <main class="workspace-body">
            
            <!-- Category Drawer (Sidebar) -->
            <aside class="category-drawer" id="categoryDrawer">
                <div class="drawer-header">
                    <h3>Categories</h3>
                    <button class="icon-btn" id="closeDrawer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="drawer-tabs">
                    <button class="drawer-tab active" data-tab="symbols">Symbols</button>
                    <button class="drawer-tab" data-tab="watchlists">Watchlists</button>
                    <button class="drawer-tab" data-tab="favorites">Favorites</button>
                    <button class="drawer-tab" data-tab="import">Batch Import</button>
                </div>

                <div class="drawer-content">
                    <div class="tab-pane active" id="pane-symbols">
                        <div id="symbolsList" class="symbol-tree-container">
                            <!-- Dynamic symbols auto-rendered by category-manager.js -->
                        </div>
                    </div>

                    <div class="tab-pane" id="pane-watchlists">
                        <div class="watchlist-controls">
                            <input type="text" id="newWatchlistName" placeholder="New Watchlist Name..." class="nav-select">
                            <button id="createWatchlistBtn" class="btn primary-btn">+ Create</button>
                        </div>
                        <ul id="watchlistsContainer"></ul>
                    </div>

                    <div class="tab-pane" id="pane-favorites">
                        <ul id="favoritesContainer"></ul>
                    </div>

                    <div class="tab-pane" id="pane-import">
                        <p><i class="fa-solid fa-upload"></i> Select TXT File Format: Symbol, Group, Sector, Industry</p>
                        <input type="file" id="batchFileInput" accept=".txt,.csv">
                    </div>
                </div>
            </aside>

            <!-- Charting Workspace Area -->
            <section class="chart-workspace">
                <div class="chart-grid grid-1x1" id="chartGrid">
                    
                    <!-- Chart Cell Container -->
                    <div class="chart-cell" data-cell-id="cell-1">
                        <div class="chart-cell-header">
                            <span class="cell-symbol-title">Select a Symbol</span>
                            <div class="cell-tools">
                                <span class="data-status-badge">Initializing DB...</span>
                                <span class="timeframe-pill">EOD</span>
                            </div>
                        </div>
                        <div class="chart-render-target">
                            <div class="empty-chart-placeholder">
                                <i class="fa-solid fa-chart-candlestick"></i>
                                <p>Select any symbol from the drawer or quick search to fetch Parquet EOD data.</p>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

        </main>
    </div>

    <!-- ES Module Script Declarations -->
    <script type="module" src="js/data-engine.js"></script>
    <script type="module" src="js/category-manager.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>

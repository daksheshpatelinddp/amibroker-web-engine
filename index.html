<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AmiBroker Web Workstation</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- TradingView Lightweight Charts Standalone -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- DuckDB WASM Browser Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-wasm.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="h-12 bg-gray-800 flex items-center justify-between px-4 border-b border-gray-700">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-red-500 text-lg">AmiBroker</span>
      <span class="bg-gray-700 px-2 py-1 rounded text-xs font-mono">RELIANCE</span>
      <button id="btn-toggle-analysis" class="bg-blue-600 px-3 py-1 rounded text-xs font-semibold hover:bg-blue-500">⚡ Analysis</button>
    </div>

    <div class="flex items-center space-x-2">
      <span id="engine-status-badge" class="status-indicator text-xs font-semibold text-yellow-400">
        ● Initializing Engine...
      </span>
    </div>
  </header>

  <!-- Workspace Viewport Container -->
  <main id="workspace-viewport" class="flex-1 w-full relative overflow-y-auto bg-black p-1">
    <!-- Multi-pane chart stack renders dynamically here -->
  </main>

  <!-- AFL Drawer Modal -->
  <div id="analysis-drawer" class="fixed inset-y-0 right-0 w-full md:w-96 bg-gray-800 border-l border-gray-700 transform translate-x-full transition-transform duration-300 z-50 flex flex-col p-4">
    <div class="flex items-center justify-between pb-2 border-b border-gray-700">
      <h3 class="font-bold text-sm text-gray-200">AFL Formula Editor</h3>
      <button id="btn-close-drawer" class="text-gray-400 hover:text-white">✕</button>
    </div>
    <textarea id="afl-editor" class="flex-1 w-full mt-2 p-2 bg-gray-900 border border-gray-700 rounded font-mono text-xs text-green-400 focus:outline-none focus:border-blue-500" placeholder="// Write AFL Code here...&#10;Plot(Close, 'Price', colorBlue);"></textarea>
    <div class="pt-3 flex space-x-2">
      <button id="btn-apply-formula" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-semibold py-1.5 rounded text-xs">Apply Formula</button>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
